name: Pull Request Workflow
permissions: write-all
env:
    PR_NUMBER: ${{ github.event.number }}
on:
    workflow_call:
        # Inputs the workflow accepts.
        inputs:
            type:
                type: string
                required: true
            pr_number:
                type: string
                required: true
            repo:
                type: string
                required: true
            owner:
                type: string
                required: true

        secrets:
            MODEL_REVIEW_CALLBACK:
                required: true
            MODEL_REVIEW_JWT:
                required: true
            GEMINI_API_KEY:
                required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    start:
        runs-on: ubuntu-latest

        steps:
            - name: Run Review
              if: (inputs.type == 'review')
              run: |
                  echo "Running Summary"
                  echo "Pull Request Number: ${{ inputs.pr_number }}"
                  echo "Repository: ${{ inputs.repo }}"
                  echo "Owner: ${{ inputs.owner }}"
            - name: Run Summary
              if: ${{ inputs.type == 'summary'}}
              run: |
                  echo "Running Summary"
                  echo "Pull Request Number: ${{ inputs.pr_number }}"
                  echo "Repository: ${{ inputs.repo }}"
                  echo "Owner: ${{ inputs.owner }}"

    retrieve:
        runs-on: "ubuntu-latest"
        needs: start
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Get PR diff from GitHub API
              env:
                  PR_NUMBER: ${{inputs.pr_number}}
                  REPO: ${{ inputs.repo }}
              run: |
                  echo "Fetching PR #$PR_NUMBER diff from API"

                  curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                       -H "Accept: application/vnd.github.v3+json" \
                       "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files" \
                       > diff.json

            - name: Upload diff as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: git-diff-json
                  path: diff.json

    review:
        runs-on: ubuntu-latest
        needs: retrieve

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm install @actions/core @actions/github @google/genai

            - uses: actions/download-artifact@v4
              with:
                  name: git-diff-json

            - name: Run Review Script
              run: node .github/scripts/review.js
              env:
                  GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
