name: Pull Request Workflow
permissions: read-all
env:
    GITHUB_AUTH: secrets.GITHUB_AUTH
    MODEL_REVIEW_CALLBACK: secrets.MODEL_REVIEW_CALLBACK
    PR_NUMBER: ${{ github.event.number }}

    # Long-lived JWT token to identify the caller.
    MODEL_REVIEW_JWT: secrets.JWT

on:
    workflow_call:
        # Inputs the workflow accepts.
        inputs:
            type:
                type: string
                required: true
            pr_number:
                type: string
                required: true
            repo:
                type: string
                required: true
            owner:
                type: string
                required: true

        secrets:
            GITHUB_AUTH:
                required: true
            MODEL_REVIEW_CALLBACK:
                required: true
            MODEL_REVIEW_JWT:
                required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    start:
        runs-on: ubuntu-latest

        steps:
            - name: Run Review
              if: (inputs.type == 'review')
              run: |
                  echo "Running Summary"
                  echo "Pull Request Number: ${{ inputs.pr_number }}"
                  echo "Repository: ${{ inputs.repo }}"
                  echo "Owner: ${{ inputs.owner }}"
            - name: Run Summary
              if: ${{ inputs.type == 'summary'}}
              run: |
                  echo "Running Summary"
                  echo "Pull Request Number: ${{ inputs.pr_number }}"
                  echo "Repository: ${{ inputs.repo }}"
                  echo "Owner: ${{ inputs.owner }}"

    retrieve:
        runs-on: "ubuntu-latest"
        needs: start
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: diff to JSON
              run: |
                  # Get the diff between HEAD and the main branch (or base for PR)
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    git fetch origin ${{ github.base_ref }}
                    DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
                  else
                    git fetch origin main
                    DIFF=$(git diff origin/main...HEAD)
                  fi
                  # Escape for JSON and write to file
                  echo "$DIFF" | jq -Rs '{diff: .}' > diff.json
            - name: Upload diff as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: git-diff-json
                  path: diff.json
